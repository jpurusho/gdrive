appId: com.gsync.app
productName: gsync
copyright: Copyright © 2026 Jerome Purushotham

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - dist/oauth-config.json
  - node_modules/**/*
  - "!node_modules/**/{test,tests,__tests__}/**"
  - "!node_modules/**/*.{md,ts,map}"
  - "!frontend/**"
  - "!desktop/**"
  - "!shared/**"
  - "!docs/**"
  - "!scripts/**"
  - "!src/**"

mac:
  category: public.app-category.utilities
  icon: resources/icon.icns
  target:
    - target: zip
      arch: [universal]
  darkModeSupport: true
  identity: null
  # better-sqlite3 v13 ships prebuilt binaries for all archs in prebuilds/.
  # Both the x64 and arm64 packaging steps include the same prebuilds dir,
  # so darwin-arm64.node (and others) are identical in both builds.
  # x64ArchFiles tells the universal merger to take these files from the x64
  # build as-is rather than lipo-merging — the prebuilds dir contains both
  # darwin-x64.node and darwin-arm64.node so both archs still work at runtime.
  x64ArchFiles: "**/better-sqlite3/prebuilds/**"

win:
  target:
    - target: nsis
      arch: [x64]

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Utility

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: jpurusho
  repo: gdrive
