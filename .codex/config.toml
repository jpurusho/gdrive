[mcp_servers.context7]
command = "npx"
args = [
    "-y",
    "@upstash/context7-mcp",
]

[mcp_servers.filesystem]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-filesystem",
    "/Users/jpurshot/experimental/gdrive",
]

[mcp_servers.github]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-github",
]

[mcp_servers.github.env]
GITHUB_PERSONAL_ACCESS_TOKEN = ""

[mcp_servers.mdi-icons]
command = "npx"
args = [
    "-y",
    "mdi-icons-mcp",
]

[mcp_servers.mui-docs]
command = "npx"
args = [
    "-y",
    "@mui/mcp@latest",
]

[mcp_servers.mui-mcp]
command = "npx"
args = [
    "-y",
    "@mui/mcp@latest",
]
